[package]
name = "kinemagic"
version = "0.11.0"
edition = "2024"
description = "A simple CLI for modeling and solving multibody mechanisms."

authors = ["Jens Olschewski"]

[[bin]]
name = "km"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29.0"
nalgebra = "0.35"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
thiserror = "2.0.20"
