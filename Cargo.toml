[package]
name = "kinemagic"
version = "0.1.0"
edition = "2024"
description = "A simple CLI for modeling and solving multibody mechanisms."

authors = ["Jens Olschewski"]

[[bin]]
name = "km"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
nalgebra = { version = "0.35"}
thiserror = "2.0"
