[package]
name = "mbs-solver"
version = "0.1.0"
edition = "2024"
description = "A simple CLI solver for suspension kinematics and elastokinematics."
authors = ["Jens Olschewski"]

[[bin]]
name = "mbs"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
nalgebra = { version = "0.35", features = ["serde-serialize"] }

# exmex = "0.21"
# serde_json = "1"
