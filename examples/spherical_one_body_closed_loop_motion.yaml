# Kinemagic example: one body connected to ground in a closed loop by two
# spherical joints.
#
# Run:
#   km check examples/spherical_one_body_closed_loop_motion.yaml
#   km solve examples/spherical_one_body_closed_loop_motion.yaml

hardpoints:
  P1: [0.0, 0.0, 0.0]
  P2: [0.0, 0.0, -200.0]
bodies:
  B1:
    body_id: 1
    side: single
    position: [0.0, 0.0, 100.0]
    orientation:
      method: euler
      euler_angles: [0, 0, 0]
    points_on_body: [P1, P2]

# --------------
# --- JOINTS ---
# --------------
joints:
  J1:
    joint_id: 1
    kind: spherical
    # defines which topology the joint belongs to
    # role can be define explicitly by auto|primary|secondary
    # defaulting to auto if ommited
    role: primary
    i:
      body_id: 0
      position: P1
      orientation:
        method: euler
        euler_angles: [0, 0, 0]
    j:
      body_id: 1
      position: P1
      orientation:
        method: euler
        euler_angles: [0, 0, 0]
  J2:
    joint_id: 2
    kind: spherical
    role: secondary
    i:
      body_id: 1
      position: P2
      orientation:
        method: euler
        euler_angles: [0, 0, 0]
    j:
      body_id: 0
      position: P2
      orientation:
        method: euler
        euler_angles: [0, 0, 0]

# --------------
# --- Motions ---
# --------------

# for closed loop mechanism number of motions needs to be the same as the
# number of remaining DOFS of the closed mechanism. So the mechanism is
# kinematiclly determined!
# So for this example
# 6 DOFS - 5 Sperical Constraints = 1 Remaining DOFS needs to be defined by
# motion
motions:
  RotateJ1:
    kind: joint-coordinates
    joint_id: 1
    displacement:
      rot_z: 90
