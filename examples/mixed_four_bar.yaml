hardpoints:
  G1: [0.0, 0.0, 0.0]
  A: [0.0, 0.0, -50.0]
  B: [150.0, 0.0, -100.0]
  G2: [150.0, 0.0, 0.0]
bodies:
  Crank:
    body_id: 1
    side: single
    position: [0.0, 0.0, -50.0]
    orientation:
      method: euler
      euler_angles: [0, 0, 0]
    points_on_body: [G1, A]
  Coupler:
    body_id: 2
    side: single
    position: [0.0, 0.0, -50.0]
    orientation:
      method: euler
      euler_angles: [0, 0, 0]
    points_on_body: [A, B]
  Rocker:
    body_id: 3
    side: single
    position: [150.0, 0.0, -100.0]
    orientation:
      method: euler
      euler_angles: [0, 0, 0]
    points_on_body: [B, G2]
joints:
  # Crank hinge at the ground pivot G1. Hinge axis is world Y (marker
  # orientation Rx(-90) maps local Z onto world Y), so the crank rotates
  # in the X-Z plane.
  J1:
    joint_id: 1
    kind: revolute
    role: primary
    i:
      body_id: 0
      position: G1
      orientation:
        method: euler
        euler_angles: [0, -90, 0]
    j:
      body_id: 1
      position: G1
      orientation:
        method: euler
        euler_angles: [0, -90, 0]
  # Crank-coupler joint at A. Spherical: mixes joint kinds within the
  # same loop, as the plane of the coupler is otherwise unconstrained.
  J2:
    joint_id: 2
    kind: spherical
    role: primary
    i:
      body_id: 1
      position: A
      orientation:
        method: euler
        euler_angles: [0, 0, 0]
    j:
      body_id: 2
      position: A
      orientation:
        method: euler
        euler_angles: [0, 0, 0]
  # Coupler-rocker joint at B. Hinge axis world Y, same plane as the crank.
  J3:
    joint_id: 3
    kind: revolute
    role: primary
    i:
      body_id: 2
      position: B
      orientation:
        method: euler
        euler_angles: [0, -90, 0]
    j:
      body_id: 3
      position: B
      orientation:
        method: euler
        euler_angles: [0, -90, 0]
  # Rocker's ground pivot G2. Closure joint: closes the loop back to
  # ground. Revolute closure residuals (#73) make this possible.
  J4:
    joint_id: 4
    kind: revolute
    role: secondary
    i:
      body_id: 3
      position: G2
      orientation:
        method: euler
        euler_angles: [0, -90, 0]
    j:
      body_id: 0
      position: G2
      orientation:
        method: euler
        euler_angles: [0, -90, 0]
motions:
  RotateCrank:
    kind: joint-coordinates
    joint_id: 1
    displacement:
      rot_z: 30
