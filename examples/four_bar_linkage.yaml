# Kinemagic example: four-bar linkage, mixing joint kinds in a closed loop.
#
# A planar square loop (200x200, in the x-z plane): three revolute/
# revolute/spherical tree joints plus one revolute joint closing the
# loop back to ground. No role is given, so the spanning tree is
# whichever three joints the partition visits first (J1, J2, J3); J4
# becomes the closure that the Newton solver drives to zero.
#
# Demonstrates:
# - a closed loop mixing revolute and spherical joints
# - time-dependent joint-coordinate motion driving the whole loop
#
# Run:
#   km check examples/four_bar_linkage.yaml
#   km solve examples/four_bar_linkage.yaml
#   km solve examples/four_bar_linkage.yaml --view=after

# ------------------
# --- HARDPOINTS ---
# ------------------

hardpoints:
  P1: [0.0, 0.0, 0.0]
  P2: [0.0, 0.0, 200.0]
  P3: [200.0, 0.0, 200.0]
  P4: [200.0, 0.0, 0.0]

# --------------
# --- BODIES ---
# --------------

bodies:
  B1:
    body_id: 1
    side: single
    position: [0.0, 0.0, 100.0]
    orientation:
      method: euler
      euler_angles: [0.0, 0.0, 0.0]
    points_on_body: [P1, P2]
  B2:
    body_id: 2
    side: single
    position: [100.0, 0.0, 200.0]
    orientation:
      method: euler
      euler_angles: [0.0, 0.0, 0.0]
    points_on_body: [P2, P3]
  B3:
    body_id: 3
    side: single
    position: [200.0, 0.0, 100.0]
    orientation:
      method: euler
      euler_angles: [0.0, 0.0, 0.0]
    points_on_body: [P3, P4]

# --------------
# --- JOINTS ---
# --------------

# Every joint's i and j marker share the same world orientation, so
# the reference relative orientation is identity for each
joints:
  J1:
    joint_id: 1
    kind: revolute
    i:
      body_id: 0
      position: P1
      orientation:
        method: euler
        euler_angles: [0.0, 90.0, 0.0]
    j:
      body_id: 1
      position: P1
      orientation:
        method: euler
        euler_angles: [0.0, 90.0, 0.0]
  J2:
    joint_id: 2
    kind: revolute
    i:
      body_id: 1
      position: P2
      orientation:
        method: euler
        euler_angles: [0.0, 90.0, 0.0]
    j:
      body_id: 2
      position: P2
      orientation:
        method: euler
        euler_angles: [0.0, 90.0, 0.0]
  J3:
    joint_id: 3
    kind: spherical
    i:
      body_id: 2
      position: P3
      orientation:
        method: euler
        euler_angles: [0.0, 90.0, 0.0]
    j:
      body_id: 3
      position: P3
      orientation:
        method: euler
        euler_angles: [0.0, 90.0, 0.0]
  J4:
    joint_id: 4
    kind: revolute
    i:
      body_id: 3
      position: P4
      orientation:
        method: euler
        euler_angles: [0.0, 90.0, 0.0]
    j:
      body_id: 0
      position: P4
      orientation:
        method: euler
        euler_angles: [0.0, 90.0, 0.0]

# ---------------
# --- MOTIONS ---
# ---------------

# Driving J1 alone is enough: J2's hinge and J3's full spherical
# freedom are solved by the Newton closure solver to keep J4's loop
# shut, same as any other free primary coordinate.
motions:
  RotateJ1:
    kind: joint-coordinates
    joint_id: 1
    displacement:
      rot_z: "10 * time"

# --------------
# --- SOLVER ---
# --------------

solver:
  start_time: 0.0
  end_time: 9.0
  step_size: 0.1
