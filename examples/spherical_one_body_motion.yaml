# Kinemagic M1 example: one moving body connected to ground by a spherical joint.
#
# Run:
#   km check examples/spherical_one_body_motion.yaml
#   km solve examples/spherical_one_body_motion.yaml
#
# This example shows only features supported by M1.
# Positions describe the reference configuration.
# Euler orientations use right-handed Z-X-Z angles in degrees.

# -------------------
# --- HARDPOINTS  ---
# -------------------

# Hardpoints use world-frame [x, y, z] coordinates.
# Bodies and joint markers reference them by name.
hardpoints:
  P1: [0.0, 0.0, 0.0]

# --------------
# --- BODIES ---
# --------------

# Body 0 is implicit ground with identity world pose.
# Each listed body defines its reference pose in the world frame.
# points_on_body names reference hardpoints attached to that body.
# Loading converts those points into body-local coordinates.
bodies:
  B1:
    body_id: 1
    side: single
    position: [0.0, 0.0, -100.0]
    orientation:
      method: euler
      euler_angles: [0, 0, 0]
    points_on_body: [P1]

# --------------
# --- JOINTS ---
# --------------

# i is the parent marker; j is the child marker.
# Marker positions and orientations are specified in the world frame.
# Loading converts both into the owning body frame.
# Marker position accepts a hardpoint name or inline [x, y, z] coordinates.
joints:
  J1:
    joint_id: 1
    kind: spherical
    # defines which topology the joint belongs to
    # role can be define explicitly by auto|primary|secondary
    # defaulting to auto if ommited
    role: auto
    i:
      body_id: 0
      position: P1
      orientation:
        method: euler
        euler_angles: [0, 0, 0]
    j:
      body_id: 1
      position: P1
      orientation:
        method: euler
        euler_angles: [0, 0, 0]

# --------------
# --- Motions ---
# --------------

# motions is optional. Without an entry, a joint keeps its reference orientation.
# Each motion targets one joint by joint_id.
# displacement rot_x | rot_y | rot_z defines a rotation-vector delta from the
# reference joint orientation, expressed in the reference i-marker frame, in degrees.
# Omitted components remain unconstrained.
# All motions describe one configuration; they are not applied as a sequence.
motions:
  RotateJ1:
    kind: joint-coordinates
    joint_id: 1
    displacement:
      rot_x: 90.0

# --------------
# --- Solver ---
# --------------

# solver is optional. Without an entry, default is used:
# start_time=0, end_time=1, step_size=1
solver:
  start_time: 0.0
  end_time: 1.0
  step_size: 1.0
