# Kinemagic example: one body connected to ground by one spherical joint.
#
# Demonstrates:
# - minimal ground-rooted mechanism
# - time-dependent joint-coordinate motion
# - solver time interval
#
# Run:
#   km check examples/spherical_one_body_motion.yaml
#   km solve examples/spherical_one_body_motion.yaml
#   km solve examples/spherical_one_body_motion.yaml --view=live

# ------------------
# --- HARDPOINTS ---
# ------------------

# Hardpoints use world-frame [x, y, z] coordinates in the reference pose.
hardpoints:
  P1: [0.0, 0.0, 0.0]

# --------------
# --- BODIES ---
# --------------

# Body 0 is implicit ground. Body points reference named hardpoints.
bodies:
  B1:
    body_id: 1
    side: single
    position: [0.0, 0.0, -100.0]
    orientation:
      method: euler
      euler_angles: [0.0, 0.0, 0.0]
    points_on_body: [P1]

# --------------
# --- JOINTS ---
# --------------

# Marker poses are authored in world coordinates and converted to body-local
# coordinates while loading.
joints:
  J1:
    joint_id: 1
    kind: spherical
    i:
      body_id: 0
      position: P1
      orientation:
        method: euler
        euler_angles: [0.0, 0.0, 0.0]
    j:
      body_id: 1
      position: P1
      orientation:
        method: euler
        euler_angles: [0.0, 0.0, 0.0]

# ---------------
# --- MOTIONS ---
# ---------------

# Rotation-vector components are expressed in degrees in the reference
# i-marker frame. Expressions may depend on solver variable `time`.
motions:
  RotateJ1:
    kind: joint-coordinates
    joint_id: 1
    displacement:
      rot_y: "45 * time"

# --------------
# --- SOLVER ---
# --------------

solver:
  start_time: 0.0
  end_time: 4.0
  step_size: 0.1
