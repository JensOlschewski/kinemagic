name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - id: version
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "kinemagic") | .version')"
          test "v$version" = "$GITHUB_REF_NAME"
          echo "value=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary: km
            asset: x86_64-unknown-linux-gnu
            extension: tar.gz
          - os: macos-26
            binary: km
            asset: x86_64-apple-darwin
            extension: tar.gz
          - os: windows-latest
            binary: km.exe
            asset: x86_64-pc-windows-msvc
            extension: zip
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: cargo build --release --locked
      - run: ./target/release/${{ matrix.binary }} --help
      - run: ./target/release/${{ matrix.binary }} check examples/spherical_one_body_motion.yaml
      - run: ./target/release/${{ matrix.binary }} solve examples/spherical_one_body_motion.yaml

      - if: runner.os != 'Windows'
        run: tar -czf kinemagic-${{ github.ref_name }}-${{ matrix.asset }}.${{ matrix.extension }} -C target/release ${{ matrix.binary }}

      - if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/release/${{ matrix.binary }} -DestinationPath kinemagic-${{ github.ref_name }}-${{ matrix.asset }}.${{ matrix.extension }}

      - uses: actions/upload-artifact@v4
        with:
          name: kinemagic-${{ matrix.asset }}
          path: kinemagic-${{ github.ref_name }}-${{ matrix.asset }}.${{ matrix.extension }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Extract release notes from changelog
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          awk -v version="$VERSION" '
          $0 ~ "^## \\[?" version "(\\]|[[:space:]]|$)" {
            in_section = 1
            next
          }
          in_section && /^## / { exit }
          in_section { print }
          END {
            if (!in_section) {
              print "No changelog section found for " version > "/dev/stderr"
              exit 1
            }
          }
          ' CHANGELOG.md > RELEASE_NOTES.md

      - uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: dist/*
