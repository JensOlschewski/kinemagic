name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check Formatting
        run: cargo fmt --check

      - name: Run Clippy Linter
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Cargo Testing
        run: cargo test --locked

      - name: Make km available
        run: echo "$GITHUB_WORKSPACE/target/debug" >> "$GITHUB_PATH"

      - name: Generate README GIF
        uses: charmbracelet/vhs-action@v2
        with:
          path: docs/assets/viewer.tape
          version: v0.11.0

      - name: Verify terminal viewer GIF is updated
        run: git diff --exit-code -- docs/assets/viewer.gif

      - name: Smoke Test
        run: |
          ./target/debug/km --help
          ./target/debug/km check examples/spherical_one_body_motion.yaml
          ./target/debug/km solve examples/spherical_one_body_motion.yaml
