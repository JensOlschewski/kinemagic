name: Terminal Viewer Demo

on:
  pull_request:
    paths:
      - .github/workflows/vhs.yml
      - Cargo.lock
      - Cargo.toml
      - docs/assets/viewer.tape
      - examples/**
      - src/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/vhs.yml
      - Cargo.lock
      - Cargo.toml
      - docs/assets/viewer.tape
      - examples/**
      - src/**

jobs:
  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: cargo build --locked

      - name: Make km available to VHS
        run: echo "$GITHUB_WORKSPACE/target/debug" >> "$GITHUB_PATH"

      - name: Generate terminal viewer GIF
        uses: charmbracelet/vhs-action@v2
        with:
          path: docs/assets/viewer.tape
          version: v0.11.0

      - uses: actions/upload-artifact@v4
        with:
          name: terminal-viewer-gif
          path: docs/assets/viewer.gif
          if-no-files-found: error

  update:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: cargo build --locked

      - name: Make km available to VHS
        run: echo "$GITHUB_WORKSPACE/target/debug" >> "$GITHUB_PATH"

      - name: Generate terminal viewer GIF
        uses: charmbracelet/vhs-action@v2
        with:
          path: docs/assets/viewer.tape
          version: v0.11.0

      - name: Commit updated terminal viewer GIF
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "docs: update terminal viewer demo"
          file_pattern: docs/assets/viewer.gif
