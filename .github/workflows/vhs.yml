name: VHS

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/vhs.yml
      - Cargo.lock
      - Cargo.toml
      - docs/assets/viewer.tape
      - examples/**
      - src/**

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: cargo build --locked

      - name: Make km available to VHS
        run: echo "$GITHUB_WORKSPACE/target/debug" >> "$GITHUB_PATH"

      - name: Generate terminal viewer GIF
        uses: charmbracelet/vhs-action@v2
        with:
          path: docs/assets/viewer.tape
          version: v0.11.0

      - name: Commit updated terminal viewer GIF
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "docs: update viewer demo"
          branch: main
          commit_user_name: vhs-action 📼
          commit_user_email: actions@github.com
          commit_author: vhs-action 📼 <actions@github.com>
          file_pattern: docs/assets/viewer.gif
