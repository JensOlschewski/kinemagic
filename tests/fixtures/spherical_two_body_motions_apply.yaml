hardpoints:
  P1: [0.0, 0.0, 0.0]
  P2: [0.0, 0.0, -200.0]
bodies:
  B1:
    body_id: 1
    side: single
    cm: [0.0, 0.0, -100.0]
    orientation: [1.0, 0.0, 0.0, 0.0]
    points_on_body: [P1, P2]
  B2:
    body_id: 2
    side: single
    cm: [0.0, 0.0, -300.0]
    orientation: [1.0, 0.0, 0.0, 0.0]
    points_on_body: [P2]
joints:
  primary:
    J1:
      id: 1
      type: spherical
      i:
        body_id: 0
        point: P1
        orientation: { method: euler, euler_angles: [0, 0, 0] }
      j:
        body_id: 1
        point: P1
        orientation: { method: euler, euler_angles: [0, 0, 0] }
    J2:
      id: 2
      type: spherical
      i:
        body_id: 1
        point: P2
        orientation: { method: euler, euler_angles: [0, 0, 0] }
      j:
        body_id: 2
        point: P2
        orientation: { method: euler, euler_angles: [0, 0, 0] }
motions:
  Motion 1:
    type: joint-coordinates
    joint_topology: primary
    joint_id: 1
    relative_orientation:
      method: quaternion
      quaternion: [0.70710678, 0.0, 0.70710678, 0.0]

  Motion 2:
    type: joint-coordinates
    joint_topology: primary
    joint_id: 2
    relative_orientation:
      method: quaternion
      quaternion: [0.70710678, 0.70710678, 0.0, 0.0]
