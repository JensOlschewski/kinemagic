hardpoints:
  P1: [0.0, 0.0, 0.0]
  P2: [0.0, 0.0, 200.0]
  P3: [200.0, 0.0, 200.0]
  P4: [200.0, 0.0, 0.0]
bodies:
  B1:
    body_id: 1
    side: single
    position: [0.0, 0.0, 100.0]
    orientation:
      method: euler
      euler_angles: [0.0, 0.0, 0.0]
    points_on_body: [P1, P2]
  B2:
    body_id: 2
    side: single
    position: [100.0, 0.0, 200.0]
    orientation:
      method: euler
      euler_angles: [0.0, 0.0, 0.0]
    points_on_body: [P2, P3]
  B3:
    body_id: 3
    side: single
    position: [200.0, 0.0, 100.0]
    orientation:
      method: euler
      euler_angles: [0.0, 0.0, 0.0]
    points_on_body: [P3, P4]
joints:
  J1:
    joint_id: 1
    kind: revolute
    i:
      body_id: 0
      position: P1
      orientation:
        method: euler
        euler_angles: [0.0, 90.0, 0.0]
    j:
      body_id: 1
      position: P1
      orientation:
        method: euler
        euler_angles: [0.0, 90.0, 0.0]
  J2:
    joint_id: 2
    kind: revolute
    i:
      body_id: 1
      position: P2
      orientation:
        method: euler
        euler_angles: [0.0, 90.0, 0.0]
    j:
      body_id: 2
      position: P2
      orientation:
        method: euler
        euler_angles: [0.0, 90.0, 0.0]
  J3:
    joint_id: 3
    kind: spherical
    i:
      body_id: 2
      position: P3
      orientation:
        method: euler
        euler_angles: [0.0, 90.0, 0.0]
    j:
      body_id: 3
      position: P3
      orientation:
        method: euler
        euler_angles: [0.0, 90.0, 0.0]
  J4:
    joint_id: 4
    kind: revolute
    i:
      body_id: 3
      position: P4
      orientation:
        method: euler
        euler_angles: [0.0, 90.0, 0.0]
    j:
      body_id: 0
      position: P4
      orientation:
        method: euler
        euler_angles: [0.0, 90.0, 0.0]
# Same loop as four_bar_linkage.yaml, but J1's motion prescribes a fixed
# 10 degree offset instead of growing from zero at t=0. The loop is only
# geometrically consistent at J1 = 0 (the authored reference pose); at the
# initial candidate (J1 = 10 degrees, J2/J3 still at their zero default,
# not yet solved) J4 no longer coincides, so `km check` reports the loop
# as incompatible at the configuration `solve` would start from.
motions:
  RotateJ1:
    kind: joint-coordinates
    joint_id: 1
    displacement:
      rot_z: 10
solver:
  start_time: 0.0
  end_time: 9.0
  step_size: 0.1
